name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vpn_test
          POSTGRES_USER: vpn
          POSTGRES_PASSWORD: vpn-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vpn -d vpn_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      VPN_TEST_DATABASE_URL: postgresql+asyncpg://vpn:vpn-test-only@127.0.0.1:5432/vpn_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest
