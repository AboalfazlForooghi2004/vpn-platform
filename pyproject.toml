[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vpn-platform"
version = "0.1.0"
description = "Telegram-first AmneziaWG subscription platform"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "VPN Platform Team" }]
dependencies = [
  "aiogram>=3.21,<4",
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "cryptography>=45,<47",
  "fastapi>=0.116,<1",
  "pydantic-settings>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "qrcode[pil]>=8.2,<9",
  "sqlalchemy[asyncio]>=2.0.41,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
  "types-qrcode>=8.2,<9",
]

[project.scripts]
vpn-api = "vpn_platform.entrypoints.api:run"
vpn-bot = "vpn_platform.entrypoints.bot:run"
vpn-worker = "vpn_platform.entrypoints.worker:run"
vpn-awg-agent = "vpn_platform.entrypoints.awg_agent:run"

[tool.hatch.build.targets.wheel]
packages = ["src/vpn_platform"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001"] # Persian user-facing strings intentionally contain non-Latin letters.

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["vpn_platform"]

[tool.coverage.run]
branch = true
source = ["vpn_platform"]
